version: "3.8"

services:
  # Development service
  panther-api-dev:
    build:
      context: .
      dockerfile: Dockerfile
      target: development
    container_name: panther-api-dev
    ports:
      - "8080:8080"
    volumes:
      # Mount source code for hot reloading in development
      - .:/app
      - /app/__pycache__
      - /app/services/__pycache__
    environment:
      - FLASK_ENV=development
      - DEBUG=true
      - PORT=8080
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=http://localhost:8081,http://localhost:3000,http://localhost:8080
    env_file:
      - .env
    networks:
      - panther-network
    restart: unless-stopped
    profiles:
      - dev

  # Production service
  panther-api:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: panther-api-prod
    ports:
      - "8080:8080"
    environment:
      - FLASK_ENV=production
      - DEBUG=false
      - PORT=8080
      - LOG_LEVEL=INFO
    env_file:
      - .env
    networks:
      - panther-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10m
      timeout: 30s
      retries: 3
      start_period: 40s
    profiles:
      - prod

networks:
  panther-network:
    driver: bridge
